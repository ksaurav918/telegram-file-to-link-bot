<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} - System Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }
        }
      }
    }
  </script>
</head>

<body class="h-full font-sans antialiased flex items-center justify-center p-6 selection:bg-emerald-500/30 selection:text-emerald-400">

  <div class="w-full max-w-md">
    <div class="bg-slate-900/40 border border-slate-900 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-sm p-8 text-center">

      <div class="inline-flex items-center justify-center h-16 w-16 rounded-full bg-slate-950 border border-slate-800 text-3xl mb-6 shadow-inner">
        {{ icon }}
      </div>

      <h2 class="text-lg font-semibold uppercase tracking-widest text-slate-200">{{ title }}</h2>

      <p class="mt-4 text-sm text-slate-400 leading-relaxed">{{ message }}</p>

      {% if hint %}
        <div class="mt-5 p-3 rounded-lg bg-slate-950/50 border border-slate-800 inline-block">
            <p class="text-[11px] text-slate-500 font-mono uppercase tracking-widest">{{ hint }}</p>
        </div>
      {% endif %}

      {% if back_url %}
        <div class="mt-8 pt-6 border-t border-slate-900">
          <a href="{{ back_url }}" class="inline-flex items-center text-xs font-semibold uppercase tracking-widest text-slate-500 hover:text-emerald-400 transition-colors group">
            <span class="mr-2 group-hover:-translate-x-1 transition-transform">←</span>
            Return to Interface
          </a>
        </div>
      {% endif %}

    </div>
  </div>

</body>
</html>
