<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Settings - Terminal Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }
        }
      }
    }
  </script>
</head>

<body class="min-h-full font-sans antialiased flex flex-col selection:bg-emerald-500/30 selection:text-emerald-400">

  <header class="border-b border-slate-900 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50 px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between max-w-7xl mx-auto">
      <div class="flex items-center gap-2">
        <span class="text-xl">⚙️</span>
        <h1 class="text-base font-semibold tracking-wider uppercase text-slate-200">System Telemetry</h1>
      </div>
      
      <nav class="flex items-center gap-6">
        <a href="/admin" class="text-sm font-medium text-slate-400 hover:text-slate-200 py-5 transition-colors">Dashboard</a>
        <a href="/admin/settings" class="text-sm font-medium text-emerald-400 border-b-2 border-emerald-500 py-5 transition-colors">Settings</a>
        
        <form method="post" action="/admin/logout" class="inline">
          <button class="text-xs font-semibold bg-slate-800 hover:bg-rose-950 text-slate-300 hover:text-rose-400 px-3 py-1.5 rounded-md border border-slate-700 hover:border-rose-900/50 transition-all cursor-pointer">
            Disconnect
          </button>
        </form>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    
    <a href="/admin" class="group inline-flex items-center text-xs font-semibold uppercase tracking-wider text-slate-500 hover:text-emerald-400 transition-colors mb-8">
      <span class="mr-2 group-hover:-translate-x-1 transition-transform">←</span> Return to Matrix
    </a>

    <div class="bg-slate-900/40 border border-slate-900 rounded-xl overflow-hidden shadow-sm">
      <div class="border-b border-slate-900 bg-slate-900/80 px-5 py-4 flex items-center gap-2">
        <span class="text-amber-400">💾</span>
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300">Volume Allocation</h2>
      </div>
      
      <div class="p-5 grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
        
        <div class="bg-slate-950/50 rounded-xl p-5 border border-slate-800/50 relative overflow-hidden group">
          <div class="absolute top-0 left-0 w-full h-0.5 bg-slate-800 group-hover:bg-amber-500 transition-colors duration-500"></div>
          <p class="text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">Storage Consumed</p>
          <div class="flex items-baseline gap-2">
            <p class="text-4xl font-light tracking-tight text-slate-100 font-mono">{{ (used_bytes / (1024**2)) | round(2) }}</p>
            <p class="text-sm font-semibold text-slate-500">MB</p>
          </div>
        </div>

        <div class="bg-slate-950/50 rounded-xl p-5 border border-slate-800/50 relative overflow-hidden group">
          <div class="absolute top-0 left-0 w-full h-0.5 bg-slate-800 group-hover:bg-emerald-500 transition-colors duration-500"></div>
          <p class="text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">Cached Objects</p>
          <div class="flex items-baseline gap-2">
            <p class="text-4xl font-light tracking-tight text-slate-100 font-mono">{{ total_files }}</p>
            <p class="text-sm font-semibold text-slate-500">Files</p>
          </div>
        </div>

        <div class="bg-slate-950/50 rounded-xl p-5 border border-slate-800/50 relative overflow-hidden group">
          <div class="absolute top-0 left-0 w-full h-0.5 bg-slate-800 group-hover:bg-blue-500 transition-colors duration-500"></div>
          <p class="text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">Peak File Footprint</p>
          <div class="flex items-baseline gap-2">
            <p class="text-4xl font-light tracking-tight text-slate-100 font-mono">{{ (largest_file / (1024**2)) | round(2) }}</p>
            <p class="text-sm font-semibold text-slate-500">MB</p>
          </div>
        </div>

      </div>
    </div>

  </main>

</body>
</html>
